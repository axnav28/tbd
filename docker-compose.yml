services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-tbd}
      POSTGRES_USER: ${POSTGRES_USER:-tbd}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-tbd_local_only}
    ports: ["5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tbd -d tbd"]
      interval: 5s
      timeout: 5s
      retries: 10
  backend:
    build: ./backend
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://tbd:tbd_local_only@db:5432/tbd}
    ports: ["8000:8000"]
    depends_on:
      db: { condition: service_healthy }
  frontend:
    build: ./frontend
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
    ports: ["3000:3000"]
    depends_on: [backend]
